{% if page %}<div class="pagination"><span>{{ page.paginator.count }} record{{ page.paginator.count|pluralize }} · Page {{ page.number }} of {{ page.paginator.num_pages }}</span><div>{% if page.has_previous %}<a class="button small" href="?{{ querystring }}&page={{ page.previous_page_number }}">← Previous</a>{% endif %}{% if page.has_next %}<a class="button small" href="?{{ querystring }}&page={{ page.next_page_number }}">Next →</a>{% endif %}</div></div>{% endif %}
