# Paid compute supports the pre-deploy migration step. Provision only on request.
services:
  - type: web
    name: audit-ledger
    runtime: python
    plan: 0.5c-512mb
    region: frankfurt
    autoDeployTrigger: "off"
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput
    preDeployCommand: python manage.py migrate --noinput && python manage.py check --deploy --fail-level WARNING
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --timeout 60 --access-logfile /dev/null
    healthCheckPath: /healthz/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.7
      - key: AUDIT_MODE
        value: hosted
      - key: AUDIT_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: audit-ledger-db
          property: connectionString
      - key: AUDIT_TIME_ZONE
        value: UTC
      - key: AUDIT_DB_SSLMODE
        value: require

databases:
  - name: audit-ledger-db
    plan: 0.1c-256mb
    region: frankfurt
    databaseName: auditledger
    user: auditledger
    postgresMajorVersion: '17'
    ipAllowList: []
